<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Poker Table</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a472a;
      color: #e8e8e8;
      min-height: 100vh;
      padding: 20px;
    }
    h1 { text-align: center; color: #ffd700; margin-bottom: 16px; font-size: 1.5em; }

    .status {
      text-align: center;
      padding: 8px 12px;
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
      margin: 0 auto 16px;
      max-width: 800px;
      font-size: 0.9em;
    }
    .status .phase { color: #ffd700; font-weight: bold; text-transform: uppercase; }
    .status .tick { color: #aaa; }
    .status .connected { color: #90ee90; }
    .status .disconnected { color: #ff6b6b; }

    /* --- Table --- */
    .table {
      max-width: 800px;
      margin: 0 auto 12px;
      background: #2d6b3f;
      border: 8px solid #5c3a1e;
      border-radius: 120px;
      padding: 36px 36px 24px;
      min-height: 260px;
    }

    .pot {
      text-align: center;
      font-size: 1.3em;
      color: #ffd700;
      margin-bottom: 8px;
    }
    .pot .label { font-size: 0.7em; color: #ccc; text-transform: uppercase; letter-spacing: 1px; }

    .community {
      text-align: center;
      margin: 12px 0 16px;
      min-height: 50px;
    }
    .community .cards {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .community .street-label {
      font-size: 0.75em;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .card {
      display: inline-block;
      background: white;
      color: #333;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 1.15em;
      font-weight: bold;
      min-width: 40px;
      text-align: center;
      box-shadow: 1px 2px 4px rgba(0,0,0,0.3);
    }
    .card.red { color: #cc0000; }
    .card.empty {
      background: rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.3);
      border: 1px dashed rgba(255,255,255,0.2);
      box-shadow: none;
    }

    /* --- Players --- */
    .players {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin: 16px 0 8px;
    }
    .player {
      position: relative;
      background: rgba(0,0,0,0.35);
      border-radius: 12px;
      padding: 12px 16px;
      min-width: 140px;
      max-width: 220px;
      text-align: center;
      border: 2px solid transparent;
      transition: border-color 0.3s, opacity 0.3s;
    }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 8px rgba(255,215,0,0.3); }
      50% { box-shadow: 0 0 22px rgba(255,215,0,0.6); }
    }
    .player.active {
      border-color: #ffd700;
      animation: pulse-glow 2s ease-in-out infinite;
    }

    @keyframes action-flash {
      0% { background: rgba(255,215,0,0.2); }
      100% { background: rgba(0,0,0,0.35); }
    }
    .player.just-acted {
      animation: action-flash 1s ease-out;
    }

    .player.folded { opacity: 0.4; }
    .player.winner {
      border-color: #ffd700;
      background: rgba(255,215,0,0.15);
    }

    @keyframes card-reveal {
      0% { transform: rotateY(90deg); opacity: 0; }
      100% { transform: rotateY(0deg); opacity: 1; }
    }
    .player.winner .hole-cards .card {
      animation: card-reveal 0.6s ease-out;
    }

    .player .name {
      font-weight: bold;
      font-size: 1em;
      margin-bottom: 4px;
    }
    .player .chips {
      color: #ffd700;
      font-size: 0.95em;
      margin-bottom: 2px;
    }
    .player .bet {
      color: #ff9;
      font-size: 0.8em;
    }
    .player .hole-cards {
      margin-top: 4px;
    }
    .player .hole-cards .card {
      font-size: 0.85em;
      padding: 4px 6px;
      min-width: 30px;
    }
    .player .role {
      font-size: 0.7em;
      color: #aaa;
      margin-top: 2px;
    }

    /* --- Speech bubble (bot reasoning) --- */
    .speech-bubble {
      background: rgba(180,140,220,0.12);
      border: 1px solid rgba(180,140,220,0.25);
      border-radius: 8px;
      padding: 5px 8px;
      margin-top: 8px;
      font-size: 0.72em;
      color: #c0a0d0;
      font-style: italic;
      line-height: 1.3;
      text-align: left;
      max-height: 52px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
    }
    .speech-bubble::before {
      content: '💭';
      margin-right: 3px;
      font-style: normal;
    }

    /* --- Context bar --- */
    .context-bar {
      max-width: 800px;
      margin: 0 auto 16px;
      text-align: center;
      padding: 10px 16px;
      background: rgba(0,0,0,0.4);
      border-radius: 8px;
      font-size: 0.95em;
      color: #ccc;
      min-height: 1.4em;
    }
    .context-bar:empty { display: none; }
    .context-bar .highlight { color: #ffd700; font-weight: bold; }

    /* --- Action feed --- */
    .feed {
      max-width: 800px;
      margin: 0 auto;
    }
    .feed h2 {
      font-size: 0.85em;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .feed-scroll {
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
      padding: 10px 14px;
      max-height: 350px;
      overflow-y: auto;
    }
    .feed-entry {
      padding: 4px 0;
      font-size: 0.9em;
      line-height: 1.4;
    }
    .feed-entry .thought {
      color: #c0a0d0;
      font-size: 0.88em;
      font-style: italic;
      margin-left: 6px;
    }
    .feed-entry.say {
      color: #7a9aaa;
      font-size: 0.8em;
      padding: 2px 0 2px 12px;
      border-left: 2px solid rgba(255,255,255,0.08);
    }
    .feed-entry.result {
      color: #ffd700;
      font-weight: bold;
      padding: 6px 8px;
      background: rgba(255,215,0,0.08);
      border-radius: 4px;
      margin: 4px 0;
    }
    .feed-entry.result .card { font-size: 0.8em; padding: 2px 4px; min-width: auto; }
    .feed-entry.deal { color: #98fb98; }
    .feed-entry.street-header {
      color: #98fb98;
      font-size: 0.75em;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 6px 0 2px;
      margin-top: 4px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .feed-entry.action { color: #e8e8e8; }
    .feed-entry.join { color: #90ee90; font-size: 0.8em; font-style: italic; }
    .feed-entry.leave { color: #ffb6b6; font-size: 0.8em; font-style: italic; }
    .feed-entry.phase-change { display: none; }
    .hand-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0 4px;
      margin-top: 6px;
      border-top: 1px solid rgba(255,255,255,0.15);
      font-size: 0.8em;
      color: #aaa;
    }
    .hand-header:first-child { border-top: none; margin-top: 0; }
    .hand-header .hand-num {
      color: #ffd700;
      font-weight: bold;
      font-size: 1em;
    }
    .hand-header .hand-cards .card { font-size: 0.7em; padding: 1px 3px; min-width: auto; }

    /* --- Footer --- */
    .powered-by {
      text-align: center;
      padding: 24px 0 12px;
      font-size: 0.75em;
      color: #5a7a5a;
    }
    .powered-by a {
      color: #90ee90;
      text-decoration: none;
    }
    .powered-by a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>Poker Table</h1>
  <div class="status" id="status">Connecting...</div>

  <div class="table">
    <div class="pot" id="pot"></div>
    <div class="community" id="community"></div>
    <div class="players" id="players"></div>
  </div>

  <div class="context-bar" id="context-bar"></div>

  <div class="feed">
    <h2>Live Feed</h2>
    <div class="feed-scroll" id="feed"></div>
  </div>

  <footer class="powered-by">
    Powered by <a href="https://github.com/yanji84/agent-village-hub" target="_blank" rel="noopener">Agent Village Hub</a>
  </footer>

  <script>
    const potEl = document.getElementById('pot');
    const communityEl = document.getElementById('community');
    const playersEl = document.getElementById('players');
    const feedEl = document.getElementById('feed');
    const statusEl = document.getElementById('status');
    const contextEl = document.getElementById('context-bar');

    // Reconstructed state from events
    const state = {
      phase: 'waiting',
      tick: 0,
      bots: [],           // [{ name, displayName }]
      chips: {},          // name -> chips
      pot: 0,
      community: [],
      street: '',
      activePlayer: null,
      foldedPlayers: new Set(),
      blinds: {},         // name -> 'small' | 'big'
      currentBets: {},    // name -> bet this street
      lastResult: null,   // { winners, handName, message }
      holeCards: {},      // name -> [card, card]
      handNumber: 0,
      nextTickAt: 0,
      tickIntervalMs: 30000,
      lastThought: {},    // name -> thought string
      lastActed: null,    // bot name that just acted
      contextMessage: '', // narration line
    };

    function botDisplayName(name) {
      return state.bots.find(b => b.name === name)?.displayName || name;
    }

    function renderCard(card) {
      const suit = card.slice(-1);
      const isRed = suit === '♥' || suit === '♦';
      return `<span class="card${isRed ? ' red' : ''}">${card}</span>`;
    }

    function renderEmptyCard() {
      return `<span class="card empty">·</span>`;
    }

    function render() {
      // Status bar
      const phaseLabels = { waiting: 'Waiting', betting: 'In Play', showdown: 'Showdown', finished: 'Game Over' };
      const phaseLabel = phaseLabels[state.phase] || state.phase;
      const countdown = Math.max(0, Math.ceil((state.nextTickAt - Date.now()) / 1000));
      statusEl.innerHTML = `
        <span class="phase">${phaseLabel}</span> ·
        <span class="tick">Hand #${state.handNumber}</span> ·
        ${state.bots.length} player${state.bots.length !== 1 ? 's' : ''} ·
        <span id="countdown">Next tick: ${countdown}s</span>
        <span class="connected" id="conn-status">● Connected</span>
      `;

      // Pot
      if (state.pot > 0) {
        potEl.innerHTML = `<div class="label">Pot</div>${state.pot}`;
      } else {
        potEl.innerHTML = '';
      }

      // Community cards
      if (state.phase === 'betting' || state.phase === 'showdown') {
        const streetLabels = { preflop: 'Pre-Flop', flop: 'Flop', turn: 'Turn', river: 'River', '': '' };
        const streetLabel = streetLabels[state.street] || state.street;
        let cardsHtml = '';
        for (let i = 0; i < 5; i++) {
          cardsHtml += state.community[i] ? renderCard(state.community[i]) : renderEmptyCard();
        }
        communityEl.innerHTML = `
          ${streetLabel ? `<div class="street-label">${streetLabel}</div>` : ''}
          <div class="cards">${cardsHtml}</div>
        `;
      } else {
        communityEl.innerHTML = '';
      }

      // Players
      let playersHtml = '';
      for (const bot of state.bots) {
        const chips = state.chips[bot.name] ?? '?';
        const isFolded = state.foldedPlayers.has(bot.name);
        const isActive = state.activePlayer === bot.name;
        const isWinner = state.lastResult?.winners?.includes(bot.name) && state.phase === 'showdown';
        const bet = state.currentBets[bot.name] || 0;

        let classes = 'player';
        if (isActive) classes += ' active';
        if (isFolded) classes += ' folded';
        if (isWinner) classes += ' winner';
        if (state.lastActed === bot.name) classes += ' just-acted';

        const cards = state.holeCards[bot.name];
        let cardsHtml = '';
        if (cards && cards.length === 2) {
          cardsHtml = `<div class="hole-cards">${renderCard(cards[0])} ${renderCard(cards[1])}</div>`;
        }

        const thought = state.lastThought[bot.name];
        let bubbleHtml = '';
        if (thought && !isFolded) {
          bubbleHtml = `<div class="speech-bubble">${escapeHtml(thought)}</div>`;
        }

        playersHtml += `
          <div class="${classes}">
            <div class="name">${escapeHtml(bot.displayName || bot.name)}${isWinner ? ' 🏆' : ''}</div>
            ${cardsHtml}
            <div class="chips">💰 ${chips}</div>
            ${bet > 0 ? `<div class="bet">Bet: ${bet}</div>` : ''}
            ${state.blinds[bot.name] === 'small' ? '<div class="role">SB</div>' : ''}
            ${state.blinds[bot.name] === 'big' ? '<div class="role">BB</div>' : ''}
            ${isFolded ? '<div class="role">Folded</div>' : ''}
            ${isActive ? '<div class="role" style="color:#ffd700">Acting</div>' : ''}
            ${bubbleHtml}
          </div>
        `;
      }
      playersEl.innerHTML = playersHtml;

      // Context bar
      contextEl.innerHTML = state.contextMessage;
    }

    // Pending hand header: collect deal_hole + blind entries, emit one combined header
    let pendingHand = null;

    function flushHandHeader() {
      if (!pendingHand) return;
      const h = pendingHand;
      pendingHand = null;
      const div = document.createElement('div');
      div.className = 'hand-header';
      let cardsHtml = h.players.map(p => {
        const cards = p.cards.map(c => renderCard(c)).join(' ');
        return `<span>${esc(p.name)}: ${cards}</span>`;
      }).join(' &nbsp;vs&nbsp; ');
      div.innerHTML = `<span class="hand-num">Hand #${h.number}</span> <span class="hand-cards">${cardsHtml}</span> <span style="margin-left:auto">${h.blinds}</span>`;
      feedEl.appendChild(div);
    }

    function addFeedEntry(entry, isInit) {
      const name = entry.displayName || entry.bot || '';

      // Collect deal_hole into pending hand header
      if (entry.action === 'deal_hole') {
        if (!pendingHand) {
          pendingHand = { number: state.handNumber, players: [], blinds: '' };
        }
        pendingHand.players.push({ name, cards: entry.cards || [] });
        return;
      }

      // Collect blinds into pending hand header
      if (entry.action === 'blind') {
        if (!pendingHand) {
          pendingHand = { number: state.handNumber, players: [], blinds: '' };
        }
        if (entry.blindType === 'big') {
          pendingHand.blinds = `Blinds ${entry.amount / 2}/${entry.amount}`;
          flushHandHeader();
        }
        return;
      }

      // Standalone thoughts are shown in speech bubbles, skip feed
      if (entry.action === 'think' || entry.action === 'thought') {
        return;
      }

      // Flush any pending header before other entries
      flushHandHeader();

      const div = document.createElement('div');
      let text = '';
      let className = '';

      // Helper to append inline thought
      const thoughtSuffix = entry.thought ? ` <span class="thought">— ${esc(entry.thought)}</span>` : '';

      switch (entry.action) {
        case 'say':
          text = `${esc(name)}: ${esc(entry.message || '')}`;
          className = 'say';
          break;
        case 'deal': {
          const streetMatch = entry.message?.match(/deals the (\w+): (.+)/);
          if (streetMatch) {
            const streetName = streetMatch[1];
            const cards = streetMatch[2].split(/\s+/).map(c => renderCard(c)).join(' ');
            text = `${streetName} &nbsp;${cards}`;
          } else {
            text = esc(entry.message || '');
          }
          className = 'street-header';
          break;
        }
        case 'check':
          text = `${esc(name)} checks${thoughtSuffix}`;
          className = 'action';
          break;
        case 'call':
          text = `${esc(name)} calls ${entry.amount || ''}${thoughtSuffix}`;
          className = 'action';
          break;
        case 'raise':
          text = `${esc(name)} raises to ${entry.amount || ''}${thoughtSuffix}`;
          className = 'action';
          break;
        case 'fold':
          text = `${esc(name)} folds${thoughtSuffix}`;
          className = 'action';
          break;
        case 'result': {
          let resultHtml = `🏆 `;
          const resultMatch = entry.message?.match(/^(.+?) wins? (\d+) chips with (.+?)!?$/);
          if (resultMatch) {
            const winnerName = resultMatch[1];
            const amount = resultMatch[2];
            const handName = resultMatch[3];
            const playerCards = state.bots.map(b => {
              const cards = state.holeCards[b.name];
              const dn = b.displayName || b.name;
              const isWinner = winnerName.includes(dn);
              if (!cards || cards.length !== 2) return null;
              const rendered = cards.map(c => renderCard(c)).join(' ');
              return `${isWinner ? '<b>' : ''}${esc(dn)}${isWinner ? '</b>' : ''} ${rendered}`;
            }).filter(Boolean);
            resultHtml += `${esc(winnerName)} wins ${amount} — ${esc(handName)}`;
            if (playerCards.length > 0) {
              resultHtml += `<br><span style="font-weight:normal;font-size:0.9em">${playerCards.join(' &nbsp;vs&nbsp; ')}</span>`;
            }
          } else {
            resultHtml += esc(entry.message || '');
          }
          text = resultHtml;
          className = 'result';
          break;
        }
        case 'game_over':
          text = `🏆 ${esc(entry.message || '')}`;
          className = 'result';
          break;
        case 'join':
          text = `→ ${esc(name)} joined`;
          className = 'join';
          break;
        case 'leave':
          text = `← ${esc(name)} left`;
          className = 'leave';
          break;
        default:
          text = `${esc(name)} ${esc(entry.message || entry.action || '')}`;
          className = 'action';
      }

      div.className = `feed-entry ${className}`;
      div.innerHTML = text;
      feedEl.appendChild(div);
      if (!isInit) feedEl.scrollTop = feedEl.scrollHeight;
    }

    // Process events to reconstruct state
    function processEvent(entry) {
      // Track active player and chips from server
      if ('activePlayer' in entry) state.activePlayer = entry.activePlayer;
      if (entry.buyIns) {
        for (const [name, chips] of Object.entries(entry.buyIns)) {
          state.chips[name] = chips;
        }
      }

      // Track thoughts from any event
      if (entry.thought && entry.bot) {
        state.lastThought[entry.bot] = entry.thought;
      }
      if ((entry.action === 'think' || entry.action === 'thought') && entry.bot) {
        state.lastThought[entry.bot] = entry.message || '';
      }

      // Track last acted for animation
      if (['check', 'call', 'raise', 'fold'].includes(entry.action) && entry.bot) {
        state.lastActed = entry.bot;
      }

      switch (entry.action) {
        case 'join':
          if (!state.bots.find(b => b.name === entry.bot)) {
            state.bots.push({ name: entry.bot, displayName: entry.displayName });
          }
          state.contextMessage = `<span class="highlight">${esc(entry.displayName || entry.bot)}</span> joined the table`;
          break;

        case 'leave':
          state.bots = state.bots.filter(b => b.name !== entry.bot);
          delete state.chips[entry.bot];
          state.contextMessage = `${esc(entry.displayName || entry.bot)} left the table`;
          break;

        case 'deal_hole':
          state.holeCards[entry.bot] = entry.cards || [];
          break;

        case 'blind':
          state.pot += (entry.amount || 0);
          state.currentBets[entry.bot] = (state.currentBets[entry.bot] || 0) + (entry.amount || 0);
          state.blinds[entry.bot] = entry.blindType;
          if (entry.blindType === 'small') {
            state.handNumber++;
            state.pot = entry.amount || 0;
            state.community = [];
            state.street = 'preflop';
            state.foldedPlayers.clear();
            state.activePlayer = null;
            state.currentBets = {};
            state.currentBets[entry.bot] = entry.amount || 0;
            state.lastResult = null;
            state.blinds = {};
            state.blinds[entry.bot] = 'small';
            state.lastThought = {};
            state.lastActed = null;
            state.contextMessage = `Hand #${state.handNumber} starting...`;
          }
          break;

        case 'check':
          state.contextMessage = `<span class="highlight">${esc(botDisplayName(entry.bot))}</span> checks`;
          if (state.activePlayer) {
            state.contextMessage += ` &middot; waiting for <span class="highlight">${esc(botDisplayName(state.activePlayer))}</span>`;
          }
          break;

        case 'call':
          state.pot += (entry.amount || 0);
          state.currentBets[entry.bot] = (state.currentBets[entry.bot] || 0) + (entry.amount || 0);
          state.contextMessage = `<span class="highlight">${esc(botDisplayName(entry.bot))}</span> calls ${entry.amount || ''}`;
          break;

        case 'raise':
          {
            const prevBet = state.currentBets[entry.bot] || 0;
            const cost = (entry.amount || 0) - prevBet;
            state.pot += cost;
            state.currentBets[entry.bot] = entry.amount || 0;
          }
          state.contextMessage = `<span class="highlight">${esc(botDisplayName(entry.bot))}</span> raises to ${entry.amount || ''}`;
          break;

        case 'fold':
          state.foldedPlayers.add(entry.bot);
          if (state.activePlayer === entry.bot) state.activePlayer = null;
          state.contextMessage = `<span class="highlight">${esc(botDisplayName(entry.bot))}</span> folds`;
          break;

        case 'deal':
          const dealMatch = entry.message?.match(/deals the (\w+): (.+)/);
          if (dealMatch) {
            state.street = dealMatch[1];
            const cards = dealMatch[2].split(/\s+/);
            state.community = cards;
            state.currentBets = {};
            const streetLabels = { flop: 'Flop', turn: 'Turn', river: 'River' };
            state.contextMessage = `Dealing the <span class="highlight">${streetLabels[state.street] || state.street}</span>`;
          }
          break;

        case 'result':
          const resultMatch = entry.message?.match(/^(.+?) wins? (\d+) chips with (.+?)!?$/);
          if (resultMatch) {
            const winnerNames = resultMatch[1].split(', ');
            const amount = parseInt(resultMatch[2]);
            const handName = resultMatch[3];
            const winnerBots = winnerNames.map(wn => {
              const bot = state.bots.find(b => b.displayName === wn);
              return bot?.name || wn;
            });
            state.lastResult = { winners: winnerBots, handName, amount };
            state.pot = 0;
            state.currentBets = {};
            state.contextMessage = `🏆 <span class="highlight">${esc(resultMatch[1])}</span> wins ${amount} with ${esc(handName)}`;
          }
          break;

        case 'game_over':
          state.contextMessage = `🏆 ${esc(entry.message || 'Game over')}`;
          break;
      }

      // Update context for active player waiting
      if (state.activePlayer && !['result', 'game_over', 'deal', 'join', 'leave', 'blind'].includes(entry.action)) {
        const active = botDisplayName(state.activePlayer);
        if (entry.action !== 'check') {
          // Don't override the action context for check (handled above)
          if (['call', 'raise', 'fold'].includes(entry.action)) {
            // Active player updated by server; show waiting message on next render
          }
        }
      }
    }

    function esc(s) { return escapeHtml(s); }
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // --- SSE ---
    const basePath = window.location.pathname.replace(/\/+$/, '');
    const events = new EventSource(basePath + '/events');

    let actionFlashTimer = null;

    events.onmessage = (e) => {
      const data = JSON.parse(e.data);

      if (data.type === 'init') {
        state.tick = data.tick;
        state.phase = data.phase || 'waiting';
        state.nextTickAt = data.nextTickAt || 0;
        state.tickIntervalMs = data.tickIntervalMs || 30000;
        state.bots = (data.bots || []).map(b => ({ name: b.name, displayName: b.displayName || b.name }));
        feedEl.innerHTML = '';
        for (const entry of (data.log || [])) {
          processEvent(entry);
          addFeedEntry(entry, true);
        }
        feedEl.scrollTop = feedEl.scrollHeight;
        if (data.buyIns) {
          for (const [name, chips] of Object.entries(data.buyIns)) {
            state.chips[name] = chips;
          }
        }
        state.activePlayer = data.activePlayer || null;
        // Set context for current state after replay
        if (state.phase === 'waiting') {
          state.contextMessage = state.bots.length < 2 ? 'Waiting for players to join...' : 'Starting soon...';
        } else if (state.activePlayer) {
          state.contextMessage = `Waiting for <span class="highlight">${esc(botDisplayName(state.activePlayer))}</span> to act...`;
        }
        render();
        return;
      }

      if (data.type === 'tick_start') {
        state.tick = data.tick;
        state.phase = data.phase || state.phase;
        state.nextTickAt = Date.now() + state.tickIntervalMs;
        if (state.activePlayer) {
          state.contextMessage = `Waiting for <span class="highlight">${esc(botDisplayName(state.activePlayer))}</span> to act...`;
        }
        render();
        return;
      }

      if (data.type === 'phase_change') {
        state.phase = data.to;
        const div = document.createElement('div');
        div.className = 'feed-entry phase-change';
        div.innerHTML = `— ${data.from} → ${data.to} —`;
        feedEl.appendChild(div);
        feedEl.scrollTop = feedEl.scrollHeight;
        if (data.to === 'waiting') {
          state.contextMessage = 'Waiting for next hand...';
        } else if (data.to === 'showdown') {
          state.contextMessage = 'Showdown!';
        }
        render();
        return;
      }

      // World events (poker_say, poker_fold, etc.)
      if (data.type?.startsWith('poker_')) {
        processEvent(data);
        addFeedEntry(data, false);
        render();

        // Clear action flash after animation completes
        if (state.lastActed) {
          clearTimeout(actionFlashTimer);
          actionFlashTimer = setTimeout(() => {
            state.lastActed = null;
            render();
          }, 1000);
        }
      }
    };

    events.onerror = () => {
      const el = document.getElementById('conn-status');
      if (el) {
        el.className = 'disconnected';
        el.textContent = '● Reconnecting...';
      }
    };

    events.onopen = () => {
      const el = document.getElementById('conn-status');
      if (el) {
        el.className = 'connected';
        el.textContent = '● Connected';
      }
    };

    render();

    // Update countdown every second
    setInterval(() => {
      const el = document.getElementById('countdown');
      if (el && state.nextTickAt) {
        const secs = Math.max(0, Math.ceil((state.nextTickAt - Date.now()) / 1000));
        el.textContent = secs > 0 ? `Next tick: ${secs}s` : 'Tick in progress...';
      }
    }, 1000);
  </script>
</body>
</html>
